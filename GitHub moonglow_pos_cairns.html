<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Moonglow POS — Cairns</title>
<style>
  :root{--bg:#f8f2ed;--surface:#f2e4d9;--tile:#fffaf6;--tile-hover:#f0e6d6;--border:#e0d0c0;--text:#2c1e14;--muted:#9a8070;--danger:#8d4b53;--success:#6b8c5e;--accent:#ad6639;--accent-text:#fff;--accent2:#bf825e;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font-family:'Georgia',serif;min-height:100vh;overflow-x:hidden}
  .header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 8px rgba(0,0,0,.06)}
  .header-left{display:flex;align-items:center;gap:10px}
  .logo{font-size:15px;font-weight:bold;color:var(--accent);letter-spacing:1px}
  .location-badge{background:var(--accent);color:var(--accent-text);font-size:10px;font-weight:bold;padding:3px 8px;border-radius:20px;letter-spacing:.5px;text-transform:uppercase}
  .cart-btn{background:var(--tile);border:1px solid var(--border);color:var(--text);padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
  .cart-count{background:var(--accent);color:var(--accent-text);border-radius:50%;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold}
  .staff-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:10px}
  .staff-bar label{font-size:12px;color:var(--muted);white-space:nowrap}
  .staff-select{flex:1;background:var(--tile);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:14px;font-family:'Georgia',serif;appearance:none;-webkit-appearance:none}
  .staff-select:focus{outline:none;border-color:var(--accent)}
  .date-bar{padding:8px 16px;font-size:12px;color:var(--muted);text-align:center;background:var(--surface);border-bottom:1px solid var(--border)}
  .screen{display:none}.screen.active{display:block}
  .cat-grid{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .cat-tile{background:var(--tile);border:1px solid var(--border);border-radius:12px;cursor:pointer;overflow:hidden;position:relative;aspect-ratio:1.7/1;display:flex;align-items:flex-end;box-shadow:0 2px 6px rgba(0,0,0,.06)}
  .cat-tile:active{opacity:.85}
  .cat-tile-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.4}
  .cat-tile-label{position:relative;z-index:2;padding:10px 12px;font-size:15px;font-weight:bold;color:#2c1e14;text-shadow:0 1px 3px rgba(255,255,255,.6);line-height:1.2}
  .back-bar{padding:10px 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);background:var(--surface)}
  .back-btn{background:none;border:none;color:var(--accent);font-size:22px;cursor:pointer;padding:4px;line-height:1}
  .back-title{font-size:15px;font-weight:bold;color:var(--text)}
  .search-wrap{padding:10px 12px 4px}
  .search-input{width:100%;background:var(--tile);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:10px;font-size:14px;font-family:'Georgia',serif}
  .search-input:focus{outline:none;border-color:var(--accent)}
  .search-input::placeholder{color:var(--muted)}
  .product-list{padding:8px 12px 80px}
  .product-item{background:var(--tile);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.04)}
  .product-item:active{background:var(--tile-hover)}
  .product-item.in-cart{border-color:var(--accent);background:rgba(172,133,97,.08)}
  .product-thumb{width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--border);flex-shrink:0}
  .product-thumb-placeholder{width:52px;height:52px;border-radius:8px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
  .product-info{flex:1;min-width:0}
  .product-name{font-size:13px;color:var(--text);line-height:1.3}
  .product-in-cart{font-size:11px;color:var(--accent);margin-top:2px}
  .product-arrow{color:var(--muted);font-size:18px}
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(44,30,20,.5);z-index:200;align-items:flex-end}
  .modal-overlay.open{display:flex}
  .modal-sheet{background:var(--tile);border-radius:16px 16px 0 0;padding:20px 16px 32px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 -4px 24px rgba(0,0,0,.12)}
  .modal-close{float:right;background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;line-height:1}
  .qty-modal{text-align:center;padding-bottom:40px}
  .qty-title{font-size:14px;color:var(--muted);margin-bottom:6px}
  .qty-product{font-size:16px;font-weight:bold;margin-bottom:20px;color:var(--text);line-height:1.3}
  .qty-controls{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:24px}
  .qty-btn{width:52px;height:52px;border-radius:50%;border:2px solid var(--accent);background:none;color:var(--accent);font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .qty-display{font-size:48px;font-weight:bold;color:var(--text);min-width:60px;text-align:center}
  .qty-add-btn{width:100%;background:var(--accent);color:var(--accent-text);border:none;border-radius:12px;padding:16px;font-size:16px;font-weight:bold;font-family:'Georgia',serif;cursor:pointer}
  .cart-items-wrap{padding:12px 0 160px}
  .cart-item{background:var(--tile);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin:0 12px 8px;display:flex;align-items:center;gap:10px}
  .cart-item-info{flex:1;min-width:0}
  .cart-item-name{font-size:13px;color:var(--text);line-height:1.3}
  .cart-item-qty{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:4px 10px;font-size:15px;font-weight:bold;color:var(--accent);min-width:36px;text-align:center}
  .cart-remove{color:var(--danger);font-size:22px;cursor:pointer;padding:4px;background:none;border:none}
  .cart-empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:15px}
  .cart-total-bar{background:var(--tile);border-top:1px solid var(--border);padding:14px 16px;position:sticky;bottom:0;box-shadow:0 -4px 12px rgba(0,0,0,.06)}
  .cart-total-row{display:flex;justify-content:space-between;margin-bottom:12px}
  .cart-total-label{font-size:14px;color:var(--muted)}
  .cart-total-value{font-size:14px;font-weight:bold;color:var(--text)}
  .submit-btn{width:100%;background:var(--accent);color:var(--accent-text);border:none;border-radius:12px;padding:16px;font-size:16px;font-weight:bold;font-family:'Georgia',serif;cursor:pointer}
  .submit-btn:disabled{opacity:.4;cursor:not-allowed}
  .success-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;padding:40px 20px;text-align:center}
  .success-icon{font-size:64px;margin-bottom:20px}
  .success-title{font-size:22px;font-weight:bold;color:var(--accent);margin-bottom:10px}
  .success-sub{font-size:14px;color:var(--muted);margin-bottom:32px}
  .new-sale-btn{background:var(--accent);color:var(--accent-text);border:none;border-radius:12px;padding:16px 32px;font-size:16px;font-weight:bold;font-family:'Georgia',serif;cursor:pointer}
  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--accent2);color:var(--text);padding:10px 20px;border-radius:20px;font-size:13px;z-index:300;opacity:0;transition:opacity .3s;white-space:nowrap;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="header">
  <div class="header-left">
    <div class="logo">&#x1F319; MOONGLOW</div>
    <div class="location-badge">Cairns</div>
  </div>
  <button class="cart-btn" onclick="showCart()">&#x1F6D2; Cart <span class="cart-count" id="cartCount">0</span></button>
</div>
<div class="staff-bar">
  <label>Staff:</label>
  <select class="staff-select" id="staffSelect">
    <option value="">— Select your name —</option>
    <option>Shion Sasahara</option>
    <option>Jasper Hill</option>
    <option>Charlotte Atkins</option>
  </select>
</div>
<div class="date-bar" id="dateBar"></div>
<div class="screen active" id="screenCats"><div class="cat-grid" id="catGrid"></div></div>
<div class="screen" id="screenProducts">
  <div class="back-bar"><button class="back-btn" onclick="showCats()">&#8592;</button><div class="back-title" id="catTitle"></div></div>
  <div class="search-wrap"><input class="search-input" id="searchInput" placeholder="Search products..." oninput="filterProducts()"></div>
  <div class="product-list" id="productList"></div>
</div>
<div class="screen" id="screenCart">
  <div class="back-bar"><button class="back-btn" onclick="showCats()">&#8592;</button><div class="back-title">Your Sale</div></div>
  <div class="cart-items-wrap" id="cartItems"></div>
  <div class="cart-total-bar">
    <div class="cart-total-row"><span class="cart-total-label">Items in sale</span><span class="cart-total-value" id="cartItemCount">0</span></div>
    <button class="submit-btn" id="submitBtn" onclick="submitSale()">Submit Sale</button>
  </div>
</div>
<div class="screen" id="screenSuccess">
  <div class="success-screen">
    <div class="success-icon">&#x2705;</div>
    <div class="success-title">Sale Logged!</div>
    <div class="success-sub" id="successMsg"></div>
    <button class="new-sale-btn" onclick="newSale()">New Sale</button>
  </div>
</div>
<div class="modal-overlay" id="qtyModal">
  <div class="modal-sheet qty-modal">
    <button class="modal-close" onclick="closeModal()">&#215;</button>
    <div class="qty-title">How many?</div>
    <div class="qty-product" id="qtyProductName"></div>
    <div class="qty-controls">
      <button class="qty-btn" onclick="changeQty(-1)">&#8722;</button>
      <div class="qty-display" id="qtyDisplay">1</div>
      <button class="qty-btn" onclick="changeQty(1)">+</button>
    </div>
    <button class="qty-add-btn" onclick="addToCart()">Add to Sale</button>
  </div>
</div>

function getProductImage(n){return PRODUCT_IMAGES[n]||'';}

var cart=[], currentCategory=null, pendingProduct=null, currentQty=1;

try{document.getElementById('dateBar').textContent=new Date().toLocaleDateString('en-AU',{weekday:'long',year:'numeric',month:'long',day:'numeric'});}catch(e){document.getElementById('dateBar').textContent=new Date().toDateString();}

function buildCats(){
  var g=document.getElementById('catGrid');g.innerHTML='';
  CATEGORIES.forEach(function(cat){
    if(!cat.products.length)return;
    var d=document.createElement('div');
    d.className='cat-tile';
    d.onclick=function(){openCategory(cat);};
    var img=document.createElement('img');
    img.className='cat-tile-img';img.src=cat.image;img.alt='';
    img.onerror=function(){this.style.display='none';};
    var label=document.createElement('div');
    label.className='cat-tile-label';label.textContent=cat.name;
    d.appendChild(img);d.appendChild(label);
    g.appendChild(d);
  });
}
buildCats();

function openCategory(cat){
  currentCategory=cat;
  document.getElementById('catTitle').textContent=cat.name;
  document.getElementById('searchInput').value='';
  renderProductList(cat.products);
  showScreen('screenProducts');
}

function filterProducts(){
  if(!currentCategory)return;
  var q=document.getElementById('searchInput').value.toLowerCase();
  renderProductList(q?currentCategory.products.filter(function(p){return p.toLowerCase().indexOf(q)>=0;}):currentCategory.products);
}

function renderProductList(products){
  var list=document.getElementById('productList');list.innerHTML='';
  if(!products.length){
    var empty=document.createElement('p');
    empty.style.cssText='color:var(--muted);padding:20px;text-align:center;font-size:14px';
    empty.textContent='No products found';list.appendChild(empty);return;
  }
  products.forEach(function(name){
    var inCart=cart.find(function(i){return i.product===name;});
    var imgUrl=getProductImage(name);
    var d=document.createElement('div');
    d.className='product-item'+(inCart?' in-cart':'');
    d.onclick=function(){openQtyModal(name);};
    var thumb;
    if(imgUrl){
      thumb=document.createElement('img');
      thumb.className='product-thumb';thumb.src=imgUrl;thumb.alt='';thumb.loading='lazy';
      thumb.onerror=function(){var ph=document.createElement('div');ph.className='product-thumb-placeholder';ph.textContent='\u{1F319}';this.parentNode.replaceChild(ph,this);};
    }else{
      thumb=document.createElement('div');thumb.className='product-thumb-placeholder';thumb.textContent='\u{1F319}';
    }
    var info=document.createElement('div');info.className='product-info';
    var nm=document.createElement('div');nm.className='product-name';nm.textContent=name;
    info.appendChild(nm);
    if(inCart){var badge=document.createElement('div');badge.className='product-in-cart';badge.textContent='In sale: qty '+inCart.qty;info.appendChild(badge);}
    var arrow=document.createElement('div');arrow.className='product-arrow';arrow.textContent='>';
    d.appendChild(thumb);d.appendChild(info);d.appendChild(arrow);
    list.appendChild(d);
  });
}

function openQtyModal(name){
  pendingProduct=name;currentQty=1;
  document.getElementById('qtyProductName').textContent=name;
  document.getElementById('qtyDisplay').textContent='1';
  document.getElementById('qtyModal').classList.add('open');
}
function changeQty(delta){currentQty=Math.max(1,currentQty+delta);document.getElementById('qtyDisplay').textContent=currentQty;}
function closeModal(){document.getElementById('qtyModal').classList.remove('open');}

function addToCart(){
  var ex=cart.find(function(i){return i.product===pendingProduct;});
  if(ex){ex.qty+=currentQty;}else{cart.push({product:pendingProduct,qty:currentQty});}
  closeModal();updateCartCount();
  showToast('Added '+currentQty+'x '+pendingProduct.substring(0,35));
  if(currentCategory){
    var q=document.getElementById('searchInput').value.toLowerCase();
    renderProductList(q?currentCategory.products.filter(function(p){return p.toLowerCase().indexOf(q)>=0;}):currentCategory.products);
  }
}

function updateCartCount(){document.getElementById('cartCount').textContent=cart.reduce(function(s,i){return s+i.qty;},0);}

function showCart(){renderCart();showScreen('screenCart');}
function renderCart(){
  var w=document.getElementById('cartItems'),c=document.getElementById('cartItemCount');
  if(!cart.length){w.innerHTML='';var e=document.createElement('div');e.className='cart-empty';e.textContent='No items yet. Tap back to add products.';w.appendChild(e);c.textContent='0';return;}
  var total=cart.reduce(function(s,i){return s+i.qty;},0);
  w.innerHTML='';
  cart.forEach(function(item,idx){
    var d=document.createElement('div');d.className='cart-item';
    var info=document.createElement('div');info.className='cart-item-info';
    var nm=document.createElement('div');nm.className='cart-item-name';nm.textContent=item.product;
    info.appendChild(nm);
    var qty=document.createElement('div');qty.className='cart-item-qty';qty.textContent='x'+item.qty;
    var rm=document.createElement('button');rm.className='cart-remove';rm.textContent='x';
    (function(i){rm.onclick=function(){removeFromCart(i);};})(idx);
    d.appendChild(info);d.appendChild(qty);d.appendChild(rm);w.appendChild(d);
  });
  c.textContent=total+' item'+(total!==1?'s':'');
}
function removeFromCart(idx){cart.splice(idx,1);updateCartCount();renderCart();}

function submitSale(){
  var staff=document.getElementById('staffSelect').value;
  if(!staff){showToast('Please select your name first');return;}
  if(!cart.length){showToast('Cart is empty');return;}
  var btn=document.getElementById('submitBtn');
  btn.textContent='Submitting...';btn.disabled=true;

  var payload=JSON.stringify({
    action:'logSale',location:LOCATION,staff:staff,
    date:new Date().toISOString(),dateStr:new Date().toLocaleDateString('en-AU'),
    items:cart.map(function(i){return {product:i.product,qty:i.qty};})
  });

  // Use no-cors fetch — Google Apps Script accepts this
  // We can't read the response but the POST goes through
  fetch(SCRIPT_URL, {
    method:'POST',
    mode:'no-cors',
    headers:{'Content-Type':'text/plain'},
    body:payload
  }).then(function(){
    var n=cart.reduce(function(s,i){return s+i.qty;},0);
    document.getElementById('successMsg').textContent=staff+' — '+n+' item'+(n!==1?'s':'')+' logged for '+LOCATION;
    showScreen('screenSuccess');
  }).catch(function(err){
    // Fallback: try via a hidden form POST (works even with strict CORS)
    var form=document.createElement('form');
    form.method='POST';
    form.action=SCRIPT_URL;
    form.target='hidden_iframe';
    form.style.display='none';
    var input=document.createElement('input');
    input.type='hidden';input.name='data';input.value=payload;
    form.appendChild(input);
    var iframe=document.createElement('iframe');
    iframe.name='hidden_iframe';iframe.style.display='none';
    document.body.appendChild(iframe);
    document.body.appendChild(form);
    iframe.onload=function(){
      var n=cart.reduce(function(s,i){return s+i.qty;},0);
      document.getElementById('successMsg').textContent=staff+' — '+n+' item'+(n!==1?'s':'')+' logged for '+LOCATION;
      showScreen('screenSuccess');
    };
    form.submit();
  });
}

function newSale(){cart=[];updateCartCount();document.getElementById('staffSelect').value='';showScreen('screenCats');}
function showScreen(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});document.getElementById(id).classList.add('active');}
function showCats(){showScreen('screenCats');closeModal();}

var toastTimer;
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},2200);}

document.getElementById('qtyModal').addEventListener('click',function(e){if(e.target===document.getElementById('qtyModal'))closeModal();});

</script>
