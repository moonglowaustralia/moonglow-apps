<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Moonglow POS — Cairns</title>
<style>
  :root {
    --terracotta: #ad6639;
    --mid-brown: #ac8561;
    --burgundy: #8d4b53;
    --cream: #f8f2ed;
    --surface: #f2e4d9;
    --text-dark: #3a2a1e;
    --text-mid: #6b4c3b;
    --shadow: 0 2px 12px rgba(58,42,30,0.10);
    --shadow-lg: 0 6px 24px rgba(58,42,30,0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: var(--cream); color: var(--text-dark); min-height: 100vh; overflow-x: hidden; }

  /* ── HEADER ── */
  .header { background: var(--terracotta); color: white; padding: 14px 16px 12px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-lg); }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .back-btn { background: rgba(255,255,255,0.18); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; display: none; align-items: center; justify-content: center; }
  .back-btn.visible { display: flex; }
  .header-title { font-size: 17px; font-weight: normal; letter-spacing: 0.5px; }
  .header-subtitle { font-size: 12px; opacity: 0.8; margin-top: 1px; }

  /* ── CART BUTTON ── */
  .cart-btn {
    position: relative;
    background: rgba(255,255,255,0.18);
    border: none;
    color: white;
    width: 42px; height: 42px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .cart-btn:active { background: rgba(255,255,255,0.3); }
  .cart-badge {
    position: absolute;
    top: -2px; right: -2px;
    background: var(--burgundy);
    color: white;
    font-size: 10px;
    font-family: -apple-system, sans-serif;
    min-width: 18px; height: 18px;
    border-radius: 9px;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
    border: 2px solid var(--terracotta);
  }
  .cart-badge.visible { display: flex; }

  /* ── STAFF BAR ── */
  .staff-bar { background: var(--surface); border-bottom: 1px solid rgba(172,133,97,0.2); padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
  .staff-bar label { font-size: 13px; color: var(--text-mid); white-space: nowrap; }
  .staff-select { flex: 1; border: 1px solid rgba(172,133,97,0.4); border-radius: 8px; padding: 7px 10px; font-size: 14px; background: white; color: var(--text-dark); font-family: inherit; }

  /* ── MAIN ── */
  .main { padding: 14px 12px; }

  /* ── TILE GRID ── */
  .tile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { background: white; border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); cursor: pointer; min-height: 110px; position: relative; display: flex; flex-direction: column; justify-content: flex-end; transition: transform 0.15s; }
  .tile:active { transform: scale(0.97); }
  .tile-bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .tile-content { position: relative; padding: 10px 12px 12px; }
  .tile-name { font-size: 14px; color: var(--text-dark); line-height: 1.3; }
  .tile-count { font-size: 11px; color: var(--text-mid); margin-top: 3px; }
  .tile-icon { font-size: 26px; margin-bottom: 4px; display: block; opacity: 0.7; }

  /* ── PRODUCT LIST ── */
  .product-list { display: none; }
  .product-list.active { display: block; }
  .tile-grid-wrap.hidden { display: none; }

  .product-item { background: white; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; display: flex; align-items: center; box-shadow: var(--shadow); cursor: pointer; gap: 10px; position: relative; transition: background 0.15s; }
  .product-item:active { background: var(--surface); }
  .product-img { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
  .product-img-placeholder { width: 52px; height: 52px; border-radius: 8px; background: var(--surface); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .product-info { flex: 1; min-width: 0; }
  .product-name { font-size: 14px; color: var(--text-dark); line-height: 1.35; }
  .product-sku { font-size: 11px; color: var(--text-mid); margin-top: 2px; }
  .product-in-cart { position: absolute; top: 8px; right: 8px; background: var(--terracotta); color: white; border-radius: 12px; font-size: 11px; padding: 2px 8px; font-family: -apple-system, sans-serif; display: none; }
  .product-in-cart.visible { display: block; }
  .product-add-btn { background: var(--terracotta); color: white; border: none; border-radius: 50%; width: 32px; height: 32px; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

  /* ── QTY MODAL (add to cart) ── */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(58,42,30,0.45); z-index: 200; align-items: flex-end; justify-content: center; }
  .modal-overlay.active { display: flex; }
  .modal { background: white; border-radius: 24px 24px 0 0; padding: 24px 20px 36px; width: 100%; max-width: 480px; box-shadow: 0 -8px 40px rgba(58,42,30,0.18); animation: slideUp 0.25s ease; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-product { font-size: 16px; color: var(--text-dark); margin-bottom: 2px; }
  .modal-tile { font-size: 13px; color: var(--text-mid); margin-bottom: 20px; }
  .qty-row { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 24px; }
  .qty-btn { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--terracotta); background: white; color: var(--terracotta); font-size: 26px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .qty-display { font-size: 40px; color: var(--text-dark); min-width: 60px; text-align: center; }
  .add-to-cart-btn { width: 100%; border: none; border-radius: 12px; padding: 16px; font-size: 16px; font-family: inherit; background: var(--terracotta); color: white; cursor: pointer; margin-bottom: 10px; }
  .modal-cancel { width: 100%; border: 1px solid rgba(172,133,97,0.4); border-radius: 12px; padding: 12px; font-size: 14px; font-family: inherit; background: white; color: var(--text-mid); cursor: pointer; }

  /* ── CART PANEL ── */
  .cart-overlay { display: none; position: fixed; inset: 0; background: rgba(58,42,30,0.45); z-index: 300; align-items: flex-end; justify-content: center; }
  .cart-overlay.active { display: flex; }
  .cart-panel { background: white; border-radius: 24px 24px 0 0; width: 100%; max-width: 480px; max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 -8px 40px rgba(58,42,30,0.18); animation: slideUp 0.25s ease; }
  .cart-header { padding: 20px 20px 14px; border-bottom: 1px solid var(--surface); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .cart-title { font-size: 18px; color: var(--text-dark); }
  .cart-close { background: var(--surface); border: none; border-radius: 50%; width: 32px; height: 32px; font-size: 18px; cursor: pointer; color: var(--text-mid); display: flex; align-items: center; justify-content: center; }
  .cart-items { flex: 1; overflow-y: auto; padding: 12px 20px; }
  .cart-empty { text-align: center; padding: 40px 20px; color: var(--text-mid); font-size: 14px; }
  .cart-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--surface); }
  .cart-item:last-child { border-bottom: none; }
  .cart-item-info { flex: 1; min-width: 0; }
  .cart-item-name { font-size: 14px; color: var(--text-dark); line-height: 1.3; }
  .cart-item-cat { font-size: 11px; color: var(--text-mid); margin-top: 2px; }
  .cart-item-qty { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .cart-qty-btn { background: var(--surface); border: none; border-radius: 50%; width: 28px; height: 28px; font-size: 16px; cursor: pointer; color: var(--text-dark); display: flex; align-items: center; justify-content: center; }
  .cart-qty-num { font-size: 15px; min-width: 24px; text-align: center; color: var(--text-dark); }
  .cart-remove { background: none; border: none; color: #c0392b; font-size: 18px; cursor: pointer; padding: 4px; }
  .cart-footer { padding: 16px 20px 32px; border-top: 1px solid var(--surface); flex-shrink: 0; }
  .cart-total { font-size: 13px; color: var(--text-mid); margin-bottom: 12px; text-align: center; }
  .payment-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .pay-btn { border: none; border-radius: 12px; padding: 16px; font-size: 16px; font-family: inherit; cursor: pointer; }
  .pay-cash { background: var(--terracotta); color: white; }
  .pay-card { background: var(--burgundy); color: white; }
  .cart-clear { width: 100%; border: 1px solid rgba(172,133,97,0.3); border-radius: 12px; padding: 11px; font-size: 13px; font-family: inherit; background: white; color: var(--text-mid); cursor: pointer; }

  /* ── LOADING ── */
  .loading-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 16px; }
  .loading-moon { font-size: 48px; animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.92)} }
  .loading-text { font-size: 14px; color: var(--text-mid); }

  /* ── TOAST ── */
  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--text-dark); color: white; padding: 12px 24px; border-radius: 24px; font-size: 14px; z-index: 400; transition: transform 0.3s ease; white-space: nowrap; box-shadow: var(--shadow-lg); }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { background: #4a7c59; }
  .toast.error { background: #8d4b53; }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-mid); font-size: 14px; }
  .empty-state .icon { font-size: 36px; margin-bottom: 10px; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <button class="back-btn" id="backBtn" onclick="goBack()">&#8592;</button>
    <div>
      <div class="header-title" id="headerTitle">Moonglow</div>
      <div class="header-subtitle" id="headerSubtitle">Loading...</div>
    </div>
  </div>
  <button class="cart-btn" onclick="openCart()">
    🛒
    <span class="cart-badge" id="cartBadge">0</span>
  </button>
</div>

<!-- STAFF BAR -->
<div class="staff-bar">
  <label>Staff:</label>
  <select class="staff-select" id="staffSelect">
    <option value="">Loading...</option>
  </select>
</div>

<!-- MAIN -->
<div class="main">
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-moon">🌙</div>
    <div class="loading-text">Loading products...</div>
  </div>
  <div class="tile-grid-wrap hidden" id="tileGridWrap">
    <div class="tile-grid" id="tileGrid"></div>
  </div>
  <div class="product-list" id="productList">
    <div id="productItems"></div>
  </div>
</div>

<!-- ADD TO CART MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-product" id="modalProduct"></div>
    <div class="modal-tile" id="modalTile"></div>
    <div class="qty-row">
      <button class="qty-btn" onclick="changeQty(-1)">−</button>
      <div class="qty-display" id="qtyDisplay">1</div>
      <button class="qty-btn" onclick="changeQty(1)">+</button>
    </div>
    <button class="add-to-cart-btn" onclick="addToCart()">Add to Cart</button>
    <button class="modal-cancel" onclick="closeModal()">Cancel</button>
  </div>
</div>

<!-- CART PANEL -->
<div class="cart-overlay" id="cartOverlay">
  <div class="cart-panel">
    <div class="cart-header">
      <div class="cart-title">Cart</div>
      <button class="cart-close" onclick="closeCart()">✕</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer">
      <div class="cart-total" id="cartTotal"></div>
      <div class="payment-row">
        <button class="pay-btn pay-cash" onclick="submitCart('Cash')">Cash</button>
        <button class="pay-btn pay-card" onclick="submitCart('Card')">Card</button>
      </div>
      <button class="cart-clear" onclick="clearCart()">Clear Cart</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzWZ_pYCfxewfml6rOg5R21yJFXaDoCNtQ61J_uVbUjHtafWd3OIWBgycFLtFAK6z1r/exec";
const LOCATION = "Cairns";

const TILE_ICONS = {
  "moondrops":"🌑","chains and cords":"⛓️","1 moon pendant":"🌙","1 moon bracelet":"⭕",
  "2 moon pendant":"🌙","2 moon bracelet":"⭕","3 moon pendant":"🌙","3 moon bracelet":"⭕",
  "4 moon pendant":"🌙","4 moon bracelet":"⭕","5 moon pendant":"🌙","5 moon bracelet":"⭕",
  "6 moon bracelet":"⭕","rings and earrings":"💍","prints, frames and coasters":"🖼️","other":"✨"
};

let tilesData = [];
let currentTile = null;
let selectedProduct = null;
let selectedTileName = null;
let qty = 1;
let cart = []; // [{name, sku, category, qty, imageURL}]

window.addEventListener('load', function() {
  loadConfig();
  loadStaff();
});

function loadConfig() {
  fetch(SCRIPT_URL + "?action=getPOSConfig&location=" + encodeURIComponent(LOCATION))
    .then(r => r.json())
    .then(data => {
      if (data.error) { showError(data.error); return; }
      tilesData = data.tiles || [];
      renderTiles();
    })
    .catch(() => showError("Could not load products. Check your connection."));
}

function loadStaff() {
  fetch(SCRIPT_URL + "?action=getStaffList&location=" + encodeURIComponent(LOCATION))
    .then(r => r.json())
    .then(data => {
      const sel = document.getElementById("staffSelect");
      sel.innerHTML = '<option value="">Select staff...</option>';
      if (data.staff && data.staff.length > 0) {
        data.staff.forEach(name => {
          const opt = document.createElement("option");
          opt.value = name; opt.textContent = name;
          sel.appendChild(opt);
        });
      } else {
        sel.innerHTML = '<option value="">No staff found</option>';
      }
    })
    .catch(() => {
      document.getElementById("staffSelect").innerHTML = '<option value="">Could not load staff</option>';
    });
}

function renderTiles() {
  document.getElementById("loadingScreen").style.display = "none";
  document.getElementById("tileGridWrap").classList.remove("hidden");
  document.getElementById("headerTitle").textContent = "Moonglow " + LOCATION;
  document.getElementById("headerSubtitle").textContent = tilesData.length + " categories";

  const grid = document.getElementById("tileGrid");
  grid.innerHTML = "";

  tilesData.forEach(tileData => {
    const icon = TILE_ICONS[tileData.tile.toLowerCase()] || "🌙";
    const div = document.createElement("div");
    div.className = "tile";
    const bgImage = tileData.tileImage || (tileData.products[0] && tileData.products[0].imageURL) || "";
    if (bgImage) {
      div.innerHTML = `<div class="tile-bg" style="background-image:url('${bgImage}');opacity:0.22;"></div>`;
    }
    div.innerHTML += `<div class="tile-content"><span class="tile-icon">${icon}</span><div class="tile-name">${tileData.tile}</div><div class="tile-count">${tileData.products.length} products</div></div>`;
    div.onclick = () => openTile(tileData);
    grid.appendChild(div);
  });
}

function openTile(tileData) {
  currentTile = tileData;
  document.getElementById("tileGridWrap").classList.add("hidden");
  document.getElementById("productList").classList.add("active");
  document.getElementById("backBtn").classList.add("visible");
  document.getElementById("headerTitle").textContent = tileData.tile;
  document.getElementById("headerSubtitle").textContent = tileData.products.length + " products";
  renderProductList(tileData);
}

function renderProductList(tileData) {
  const container = document.getElementById("productItems");
  container.innerHTML = "";

  tileData.products.forEach(product => {
    const div = document.createElement("div");
    div.className = "product-item";
    div.id = "product-" + product.name.replace(/\s+/g, '-');

    const cartItem = cart.find(c => c.name === product.name);
    const inCartBadge = cartItem ? `<span class="product-in-cart visible">In cart: ${cartItem.qty}</span>` : `<span class="product-in-cart"></span>`;

    const imgHTML = product.imageURL
      ? `<img class="product-img" src="${product.imageURL}" alt="" onerror="this.style.display='none'">`
      : `<div class="product-img-placeholder">🌙</div>`;

    div.innerHTML = `
      ${imgHTML}
      <div class="product-info">
        <div class="product-name">${product.name}</div>
        ${product.sku ? `<div class="product-sku">${product.sku}</div>` : ""}
        ${inCartBadge}
      </div>
      <button class="product-add-btn">+</button>`;

    div.querySelector('.product-add-btn').onclick = (e) => {
      e.stopPropagation();
      openModal(product, tileData.tile);
    };
    div.onclick = () => openModal(product, tileData.tile);
    container.appendChild(div);
  });
}

function goBack() {
  document.getElementById("tileGridWrap").classList.remove("hidden");
  document.getElementById("productList").classList.remove("active");
  document.getElementById("backBtn").classList.remove("visible");
  document.getElementById("headerTitle").textContent = "Moonglow " + LOCATION;
  document.getElementById("headerSubtitle").textContent = tilesData.length + " categories";
  currentTile = null;
}

// ── ADD TO CART MODAL ─────────────────────────────────────────
function openModal(product, tileName) {
  selectedProduct = product;
  selectedTileName = tileName;
  qty = 1;
  document.getElementById("modalProduct").textContent = product.name;
  document.getElementById("modalTile").textContent = tileName;
  document.getElementById("qtyDisplay").textContent = qty;
  document.getElementById("modalOverlay").classList.add("active");
}

function closeModal() {
  document.getElementById("modalOverlay").classList.remove("active");
  selectedProduct = null;
}

function changeQty(delta) {
  qty = Math.max(1, qty + delta);
  document.getElementById("qtyDisplay").textContent = qty;
}

function addToCart() {
  if (!selectedProduct) return;
  const existing = cart.find(c => c.name === selectedProduct.name);
  if (existing) {
    existing.qty += qty;
  } else {
    cart.push({
      name: selectedProduct.name,
      sku: selectedProduct.sku || "",
      category: selectedTileName,
      qty: qty,
      imageURL: selectedProduct.imageURL || "",
      inventoryName: selectedProduct.inventoryName || ""
    });
  }
  updateCartBadge();
  closeModal();
  // Refresh product list to show in-cart badge
  if (currentTile) renderProductList(currentTile);
  showToast("Added to cart — " + qty + "x " + selectedProduct.name, "success");
}

function updateCartBadge() {
  const total = cart.reduce((sum, item) => sum + item.qty, 0);
  const badge = document.getElementById("cartBadge");
  badge.textContent = total;
  if (total > 0) badge.classList.add("visible");
  else badge.classList.remove("visible");
}

// ── CART PANEL ────────────────────────────────────────────────
function openCart() {
  renderCartPanel();
  document.getElementById("cartOverlay").classList.add("active");
}

function closeCart() {
  document.getElementById("cartOverlay").classList.remove("active");
}

function renderCartPanel() {
  const container = document.getElementById("cartItems");
  const total = cart.reduce((sum, item) => sum + item.qty, 0);
  document.getElementById("cartTotal").textContent = total + " item" + (total !== 1 ? "s" : "") + " in cart";

  if (cart.length === 0) {
    container.innerHTML = '<div class="cart-empty">🛒<br><br>Cart is empty</div>';
    return;
  }

  container.innerHTML = "";
  cart.forEach((item, idx) => {
    const div = document.createElement("div");
    div.className = "cart-item";
    div.innerHTML = `
      <div class="cart-item-info">
        <div class="cart-item-name">${item.name}</div>
        <div class="cart-item-cat">${item.category}</div>
      </div>
      <div class="cart-item-qty">
        <button class="cart-qty-btn" onclick="cartChangeQty(${idx}, -1)">−</button>
        <span class="cart-qty-num">${item.qty}</span>
        <button class="cart-qty-btn" onclick="cartChangeQty(${idx}, 1)">+</button>
      </div>
      <button class="cart-remove" onclick="cartRemove(${idx})">✕</button>`;
    container.appendChild(div);
  });
}

function cartChangeQty(idx, delta) {
  cart[idx].qty = Math.max(1, cart[idx].qty + delta);
  updateCartBadge();
  renderCartPanel();
  if (currentTile) renderProductList(currentTile);
}

function cartRemove(idx) {
  cart.splice(idx, 1);
  updateCartBadge();
  renderCartPanel();
  if (currentTile) renderProductList(currentTile);
}

function clearCart() {
  cart = [];
  updateCartBadge();
  renderCartPanel();
  if (currentTile) renderProductList(currentTile);
}

// ── SUBMIT CART ───────────────────────────────────────────────
function submitCart(paymentMethod) {
  const staff = document.getElementById("staffSelect").value;
  if (!staff) {
    showToast("Please select a staff member", "error");
    return;
  }
  if (cart.length === 0) {
    showToast("Cart is empty", "error");
    return;
  }

  closeCart();

  const timestamp = new Date().toISOString();
  const promises = cart.map(item => {
    const params = new URLSearchParams({
      action: "logSale",
      location: LOCATION,
      staff: staff,
      product: item.name,
      sku: item.sku,
      category: item.category,
      quantity: item.qty,
      payment: paymentMethod,
      timestamp: timestamp,
      inventoryName: item.inventoryName || ""
    });
    return fetch(SCRIPT_URL + "?" + params.toString()).then(r => r.json());
  });

  Promise.all(promises)
    .then(results => {
      const errors = results.filter(r => r.error);
      if (errors.length) {
        showToast("Some items failed to save", "error");
      } else {
        const total = cart.reduce((sum, item) => sum + item.qty, 0);
        showToast(total + " item" + (total !== 1 ? "s" : "") + " logged — " + paymentMethod, "success");
        cart = [];
        updateCartBadge();
        if (currentTile) renderProductList(currentTile);
      }
    })
    .catch(() => showToast("Could not reach spreadsheet", "error"));
}

// ── TOAST ─────────────────────────────────────────────────────
function showToast(msg, type) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast " + (type || "");
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3000);
}

function showError(msg) {
  document.getElementById("loadingScreen").innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><div>${msg}</div></div>`;
}

document.getElementById("modalOverlay").addEventListener("click", function(e) { if (e.target === this) closeModal(); });
document.getElementById("cartOverlay").addEventListener("click", function(e) { if (e.target === this) closeCart(); });
</script>
</body>
</html>
