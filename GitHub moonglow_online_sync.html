<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moonglow — Online Sales Sync</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f8f2ed;
    color: #3a2a1a;
    min-height: 100vh;
  }

  header {
    background: #3a2a1a;
    color: #f8f2ed;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  header span {
    font-size: 13px;
    opacity: 0.6;
    margin-left: auto;
  }

  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px 16px;
  }

  .card {
    background: white;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }

  .card h2 {
    font-size: 14px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #8d6a4a;
    margin-bottom: 16px;
  }

  .row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: flex-end;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  label {
    font-size: 12px;
    font-weight: 600;
    color: #8d6a4a;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  input[type="date"], input[type="text"] {
    padding: 9px 12px;
    border: 1.5px solid #e0d5cc;
    border-radius: 6px;
    font-size: 14px;
    background: #faf7f5;
    color: #3a2a1a;
    outline: none;
  }

  input:focus {
    border-color: #ad6639;
  }

  .btn {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, background 0.15s;
    white-space: nowrap;
  }

  .btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .btn-primary {
    background: #ad6639;
    color: white;
  }

  .btn-primary:hover:not(:disabled) {
    background: #8d4f28;
  }

  .btn-success {
    background: #2e7d52;
    color: white;
  }

  .btn-success:hover:not(:disabled) {
    background: #1f5c3a;
  }

  .btn-outline {
    background: white;
    color: #ad6639;
    border: 1.5px solid #ad6639;
  }

  .btn-outline:hover:not(:disabled) {
    background: #fdf0e8;
  }

  .btn-done {
    background: #2e7d52;
    color: white;
    padding: 5px 12px;
    font-size: 12px;
    border-radius: 4px;
  }

  .btn-done:hover:not(:disabled) {
    background: #1f5c3a;
  }

  .btn-done.done-already {
    background: #ccc;
    cursor: default;
  }

  .status-bar {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    margin-top: 16px;
  }

  .action-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid #f0e8e0;
  }

  .toast {
    padding: 10px 16px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
  }

  .toast-info { background: #e8f4fd; color: #1a5276; }
  .toast-success { background: #e8f6ee; color: #1e6e3d; }
  .toast-error { background: #fde8e8; color: #6e1e1e; }
  .toast-warning { background: #fef6e8; color: #6e4a1e; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  thead tr {
    background: #f2e4d9;
  }

  th {
    padding: 9px 10px;
    text-align: left;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #8d6a4a;
    border-bottom: 2px solid #e0d5cc;
  }

  td {
    padding: 8px 10px;
    border-bottom: 1px solid #f0e8e0;
    vertical-align: middle;
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fdf8f5; }

  .status-pending {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    background: #fff3e0;
    color: #b45309;
    font-size: 11px;
    font-weight: 600;
  }

  .status-done {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    background: #e8f6ee;
    color: #1e6e3d;
    font-size: 11px;
    font-weight: 600;
  }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    background: #f2e4d9;
    color: #8d4b53;
    font-size: 11px;
    font-weight: 600;
  }

  .not-found {
    color: #c0392b;
    font-weight: 600;
  }

  .summary-counts {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  .count-box {
    background: #f2e4d9;
    border-radius: 8px;
    padding: 12px 18px;
    text-align: center;
    min-width: 90px;
  }

  .count-box .num {
    font-size: 24px;
    font-weight: 700;
    color: #ad6639;
  }

  .count-box .lbl {
    font-size: 11px;
    color: #8d6a4a;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 2px;
  }

  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-right: 6px;
    vertical-align: middle;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .hidden { display: none; }

  .orders-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 12px;
  }

  @media (max-width: 600px) {
    .row { flex-direction: column; }
    .summary-counts { gap: 10px; }
  }
</style>
</head>
<body>

<header>
  <h1>Moonglow — Online Sales Sync</h1>
  <span id="headerStatus"></span>
</header>

<div class="container">

  <!-- STEP 1: Fetch Orders -->
  <div class="card">
    <h2>Step 1 — Fetch Shopify Orders</h2>
    <div class="row">
      <div class="field">
        <label>Start Date</label>
        <input type="date" id="startDate">
      </div>
      <div class="field">
        <label>End Date</label>
        <input type="date" id="endDate">
      </div>
      <div class="field">
        <label>Your Name</label>
        <input type="text" id="syncedBy" placeholder="e.g. Madi" style="width:140px">
      </div>
      <button class="btn btn-primary" id="fetchBtn" onclick="fetchOrders()">Fetch Orders</button>
    </div>
    <div id="fetchStatus" class="status-bar hidden"></div>
  </div>

  <!-- STEP 2: Preview & Submit -->
  <div class="card hidden" id="previewCard">
    <div class="orders-header">
      <h2>Step 2 — Preview &amp; Submit</h2>
      <div class="summary-counts" id="summaryCounts"></div>
    </div>

    <div style="overflow-x:auto;">
      <table id="previewTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Order</th>
            <th>Product</th>
            <th>SKU Raw</th>
            <th>Components</th>
            <th>Qty</th>
            <th>Already in sheet?</th>
          </tr>
        </thead>
        <tbody id="previewBody"></tbody>
      </table>
    </div>

    <div class="action-row">
      <button class="btn btn-primary" id="submitBtn" onclick="submitPending()">Submit All as Pending</button>
      <span id="submitStatus"></span>
    </div>
  </div>

  <!-- STEP 3: Mark Done -->
  <div class="card hidden" id="doneCard">
    <div class="orders-header">
      <h2>Step 3 — Mark Done &amp; Deduct from HQ Stock</h2>
      <button class="btn btn-success" id="markAllBtn" onclick="markAllDone()">Mark All Pending Done</button>
    </div>

    <div style="overflow-x:auto;">
      <table id="doneTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Order</th>
            <th>Product</th>
            <th>Components</th>
            <th>Qty</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="doneBody"></tbody>
      </table>
    </div>

    <div id="doneStatus" class="status-bar hidden"></div>
  </div>

</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzWZ_pYCfxewfml6rOg5R21yJFXaDoCNtQ61J_uVbUjHtafWd3OIWBgycFLtFAK6z1r/exec";

let fetchedRows = [];
let submittedRows = [];
// rowIndex is the 1-based sheet row assigned after submit

// ============================================================
// FETCH ORDERS
// ============================================================

async function fetchOrders() {
  const startDate = document.getElementById("startDate").value;
  const endDate = document.getElementById("endDate").value;

  if (!startDate || !endDate) {
    showStatus("fetchStatus", "Enter both start and end date.", "error");
    return;
  }

  const btn = document.getElementById("fetchBtn");
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Fetching...';
  showStatus("fetchStatus", "Connecting to Shopify...", "info");

  try {
    const url = GAS_URL + "?action=fetchShopifyOrders&startDate=" + startDate + "&endDate=" + endDate;
    const res = await fetch(url);
    const data = await res.json();

    if (data.error) {
      showStatus("fetchStatus", "Error: " + data.error, "error");
      return;
    }

    fetchedRows = data.rows || [];
    showStatus("fetchStatus", "Fetched " + fetchedRows.length + " line items from Shopify.", "success");
    renderPreview();

  } catch (err) {
    showStatus("fetchStatus", "Network error: " + err.message, "error");
  } finally {
    btn.disabled = false;
    btn.innerHTML = "Fetch Orders";
  }
}

// ============================================================
// RENDER PREVIEW TABLE
// ============================================================

function renderPreview() {
  if (fetchedRows.length === 0) {
    document.getElementById("previewCard").classList.add("hidden");
    return;
  }

  const tbody = document.getElementById("previewBody");
  tbody.innerHTML = "";

  let newCount = 0;
  let dupCount = 0;

  fetchedRows.forEach(function(row, idx) {
    const isDup = row.duplicate || false;
    if (isDup) dupCount++; else newCount++;

    const tr = document.createElement("tr");
    tr.innerHTML =
      "<td>" + (row.date || "") + "</td>" +
      "<td>" + (row.orderNumber || "") + "</td>" +
      "<td>" + (row.productName || "") + "</td>" +
      "<td style='font-size:11px;color:#666'>" + (row.skuRaw || "") + "</td>" +
      "<td><strong>" + (row.components || "") + "</strong></td>" +
      "<td>" + (row.qty || 1) + "</td>" +
      "<td>" + (isDup ? '<span class="badge">In sheet</span>' : "—") + "</td>";
    tbody.appendChild(tr);
  });

  // Summary counts
  document.getElementById("summaryCounts").innerHTML =
    '<div class="count-box"><div class="num">' + fetchedRows.length + '</div><div class="lbl">Total</div></div>' +
    '<div class="count-box"><div class="num">' + newCount + '</div><div class="lbl">New</div></div>' +
    '<div class="count-box"><div class="num">' + dupCount + '</div><div class="lbl">Already in sheet</div></div>';

  document.getElementById("previewCard").classList.remove("hidden");
  document.getElementById("doneCard").classList.add("hidden");
}

// ============================================================
// SUBMIT AS PENDING
// ============================================================

async function submitPending() {
  const syncedBy = document.getElementById("syncedBy").value.trim() || "Unknown";
  const btn = document.getElementById("submitBtn");

  if (fetchedRows.length === 0) {
    showInline("submitStatus", "Nothing to submit.", "warning");
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Submitting...';
  showInline("submitStatus", "", "");

  const rowsWithSyncedBy = fetchedRows.map(function(r) {
    return Object.assign({}, r, { syncedBy: syncedBy });
  });

  try {
    const url = GAS_URL + "?action=submitShopifySync&payload=" + encodeURIComponent(JSON.stringify(rowsWithSyncedBy));
    const res = await fetch(url);
    const data = await res.json();

    if (data.error) {
      showInline("submitStatus", "Error: " + data.error, "error");
    } else {
      showInline("submitStatus",
        "Added " + data.added + " rows. Skipped " + data.skipped + " duplicates.",
        "success");
    }

  } catch (err) {
    showInline("submitStatus", "Timed out — rows saved in sheet. Click Mark All Pending Done below.", "warning");
  } finally {
    btn.disabled = false;
    btn.innerHTML = "Submit All as Pending";
    submittedRows = rowsWithSyncedBy;
    await loadPendingRows();
  }
}

// ============================================================
// LOAD PENDING ROWS INTO DONE TABLE
// ============================================================

async function loadPendingRows() {
  // Re-fetch HQ stock and Shopify Sales to render the done table
  // We build the done table from submittedRows for now, assigning row numbers
  // The GAS knows the actual row numbers on the sheet

  const tbody = document.getElementById("doneBody");
  tbody.innerHTML = "";

  submittedRows.forEach(function(row, idx) {
    const tr = document.createElement("tr");
    tr.id = "doneRow_" + idx;
    tr.innerHTML =
      "<td>" + (row.date || "") + "</td>" +
      "<td>" + (row.orderNumber || "") + "</td>" +
      "<td>" + (row.productName || "") + "</td>" +
      "<td><strong>" + (row.components || "") + "</strong></td>" +
      "<td>" + (row.qty || 1) + "</td>" +
      "<td id='rowStatus_" + idx + "'><span class='status-pending'>Pending</span></td>" +
      "<td><button class='btn btn-done' id='doneBtn_" + idx + "' onclick='markOneDone(" + idx + ")'>Done</button></td>";
    tbody.appendChild(tr);
  });

  document.getElementById("doneCard").classList.remove("hidden");
  document.getElementById("doneStatus").classList.add("hidden");
}

// ============================================================
// MARK ONE ROW DONE
// Uses orderNumber + skuRaw to identify the row on the sheet
// ============================================================

async function markOneDone(idx) {
  const row = submittedRows[idx];
  if (!row) return;

  const btn = document.getElementById("doneBtn_" + idx);
  if (btn) { btn.disabled = true; btn.innerHTML = "..."; }

  try {
    const url = GAS_URL + "?action=markOneDone" +
      "&orderNumber=" + encodeURIComponent(row.orderNumber) +
      "&skuRaw=" + encodeURIComponent(row.skuRaw);
    const res = await fetch(url);
    const data = await res.json();

    if (data.error) {
      if (btn) { btn.disabled = false; btn.innerHTML = "Done"; }
      showStatus("doneStatus", "Error on row " + (idx+1) + ": " + data.error, "error");
      return;
    }

    document.getElementById("rowStatus_" + idx).innerHTML = "<span class='status-done'>Done</span>";
    if (btn) { btn.className = "btn btn-done done-already"; btn.innerHTML = "Done"; btn.disabled = true; }

  } catch (err) {
    if (btn) { btn.disabled = false; btn.innerHTML = "Done"; }
    showStatus("doneStatus", "Network error: " + err.message, "error");
  }
}

// ============================================================
// MARK ALL DONE
// ============================================================

async function markAllDone() {
  const btn = document.getElementById("markAllBtn");
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Processing...';
  showStatus("doneStatus", "Marking all pending rows as done and deducting from HQ Stock...", "info");

  try {
    const url = GAS_URL + "?action=markAllDone";
    const res = await fetch(url);
    const data = await res.json();

    if (data.error) {
      showStatus("doneStatus", "Error: " + data.error, "error");
      return;
    }

    // Update all pending rows in the UI
    submittedRows.forEach(function(row, idx) {
      const statusEl = document.getElementById("rowStatus_" + idx);
      const btnEl = document.getElementById("doneBtn_" + idx);
      if (statusEl) statusEl.innerHTML = "<span class='status-done'>Done</span>";
      if (btnEl) { btnEl.className = "btn btn-done done-already"; btnEl.innerHTML = "Done"; btnEl.disabled = true; }
    });

    let msg = "Processed " + data.processed + " rows.";
    if (data.errors && data.errors.length > 0) {
      msg += " Warnings: " + data.errors.join(", ");
      showStatus("doneStatus", msg, "warning");
    } else {
      showStatus("doneStatus", msg + " HQ Stock updated.", "success");
    }

  } catch (err) {
    showStatus("doneStatus", "Network error: " + err.message, "error");
  } finally {
    btn.disabled = false;
    btn.innerHTML = "Mark All Pending Done";
  }
}

// ============================================================
// HELPERS
// ============================================================

function showStatus(elId, msg, type) {
  const el = document.getElementById(elId);
  if (!el) return;
  if (!msg) { el.classList.add("hidden"); return; }
  el.className = "status-bar toast toast-" + type;
  el.textContent = msg;
  el.classList.remove("hidden");
}

function showInline(elId, msg, type) {
  const el = document.getElementById(elId);
  if (!el) return;
  if (!msg) { el.className = ""; el.textContent = ""; return; }
  el.className = "toast toast-" + type;
  el.textContent = msg;
}

// Set default date range to last 7 days
(function() {
  const today = new Date();
  const week = new Date(today);
  week.setDate(week.getDate() - 7);
  document.getElementById("endDate").value = today.toISOString().substring(0, 10);
  document.getElementById("startDate").value = week.toISOString().substring(0, 10);
})();
</script>

</body>
</html>
