<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Moonglow POS — Eumundi</title>
<style>
  :root {
    --terracotta: #ad6639;
    --mid-brown: #ac8561;
    --burgundy: #8d4b53;
    --lilac: #b6a2d4;
    --cream: #f8f2ed;
    --surface: #f2e4d9;
    --text-dark: #3a2a1e;
    --text-mid: #6b4c3b;
    --white: #ffffff;
    --shadow: 0 2px 12px rgba(58,42,30,0.10);
    --shadow-lg: 0 6px 24px rgba(58,42,30,0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Georgia', serif;
    background: var(--cream);
    color: var(--text-dark);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  .header {
    background: var(--terracotta);
    color: var(--white);
    padding: 14px 16px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow-lg);
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .back-btn {
    background: rgba(255,255,255,0.18);
    border: none;
    color: white;
    width: 36px; height: 36px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .back-btn:active { background: rgba(255,255,255,0.3); }
  .back-btn.visible { display: flex; }
  .header-title { font-size: 17px; font-weight: normal; letter-spacing: 0.5px; }
  .header-subtitle { font-size: 12px; opacity: 0.8; margin-top: 1px; }
  .location-badge {
    background: rgba(255,255,255,0.2);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 12px;
    letter-spacing: 0.5px;
  }

  /* ── STAFF SELECT ── */
  .staff-bar {
    background: var(--surface);
    border-bottom: 1px solid rgba(172,133,97,0.2);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .staff-bar label { font-size: 13px; color: var(--text-mid); white-space: nowrap; }
  .staff-select {
    flex: 1;
    border: 1px solid rgba(172,133,97,0.4);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 14px;
    background: white;
    color: var(--text-dark);
    font-family: inherit;
  }

  /* ── MAIN CONTENT ── */
  .main { padding: 14px 12px; }

  /* ── TILE GRID ── */
  .tile-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .tile {
    background: white;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    min-height: 110px;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .tile:active { transform: scale(0.97); box-shadow: 0 1px 6px rgba(58,42,30,0.10); }

  .tile-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0.18;
  }
  .tile-content {
    position: relative;
    padding: 10px 12px 12px;
  }
  .tile-name {
    font-size: 14px;
    color: var(--text-dark);
    line-height: 1.3;
    font-weight: normal;
  }
  .tile-count {
    font-size: 11px;
    color: var(--text-mid);
    margin-top: 3px;
  }
  .tile-icon {
    font-size: 26px;
    margin-bottom: 4px;
    display: block;
    opacity: 0.7;
  }

  /* ── PRODUCT LIST ── */
  .product-list { display: none; }
  .product-list.active { display: block; }
  .tile-grid-wrap { display: block; }
  .tile-grid-wrap.hidden { display: none; }

  .product-item {
    background: white;
    border-radius: 12px;
    padding: 13px 14px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: background 0.15s;
    gap: 10px;
  }
  .product-item:active { background: var(--surface); }
  .product-name { font-size: 14px; color: var(--text-dark); line-height: 1.35; flex: 1; }
  .product-sku { font-size: 11px; color: var(--text-mid); margin-top: 2px; }
  .product-arrow { color: var(--mid-brown); font-size: 16px; opacity: 0.5; }
  .product-img {
    width: 52px; height: 52px;
    border-radius: 8px;
    object-fit: cover;
    background: var(--surface);
    flex-shrink: 0;
  }
  .product-img-placeholder {
    width: 52px; height: 52px;
    border-radius: 8px;
    background: var(--surface);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .tile-bg { position: absolute; inset: 0; background-size: cover; background-position: center; }

  /* ── QUANTITY MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(58,42,30,0.45);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.active { display: flex; }

  .modal {
    background: white;
    border-radius: 24px 24px 0 0;
    padding: 24px 20px 36px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 -8px 40px rgba(58,42,30,0.18);
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .modal-product { font-size: 16px; color: var(--text-dark); margin-bottom: 4px; }
  .modal-tile { font-size: 13px; color: var(--text-mid); margin-bottom: 20px; }

  .qty-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-bottom: 24px;
  }
  .qty-btn {
    width: 50px; height: 50px;
    border-radius: 50%;
    border: 2px solid var(--terracotta);
    background: white;
    color: var(--terracotta);
    font-size: 26px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .qty-btn:active { background: var(--surface); }
  .qty-display {
    font-size: 40px;
    color: var(--text-dark);
    min-width: 60px;
    text-align: center;
  }

  .payment-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .pay-btn {
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    transition: opacity 0.15s;
    font-weight: normal;
  }
  .pay-btn:active { opacity: 0.8; }
  .pay-cash { background: var(--terracotta); color: white; }
  .pay-card { background: var(--burgundy); color: white; }
  .pay-cancel {
    width: 100%;
    border: 1px solid rgba(172,133,97,0.4);
    border-radius: 12px;
    padding: 12px;
    font-size: 14px;
    font-family: inherit;
    background: white;
    color: var(--text-mid);
    cursor: pointer;
  }

  /* ── LOADING ── */
  .loading-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    gap: 16px;
  }
  .loading-moon {
    font-size: 48px;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.92); }
  }
  .loading-text { font-size: 14px; color: var(--text-mid); }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--text-dark);
    color: white;
    padding: 12px 24px;
    border-radius: 24px;
    font-size: 14px;
    z-index: 300;
    transition: transform 0.3s ease;
    white-space: nowrap;
    box-shadow: var(--shadow-lg);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { background: #4a7c59; }
  .toast.error { background: #8d4b53; }

  /* ── EMPTY STATE ── */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-mid);
    font-size: 14px;
  }
  .empty-state .icon { font-size: 36px; margin-bottom: 10px; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <button class="back-btn" id="backBtn" onclick="goBack()">&#8592;</button>
    <div>
      <div class="header-title" id="headerTitle">Moonglow</div>
      <div class="header-subtitle" id="headerSubtitle">Loading...</div>
    </div>
  </div>
  <div class="location-badge">Eumundi</div>
</div>

<!-- STAFF BAR -->
<div class="staff-bar">
  <label>Staff:</label>
  <select class="staff-select" id="staffSelect">
    <option value="">Loading...</option>
  </select>
</div>

<!-- MAIN -->
<div class="main">

  <!-- LOADING -->
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-moon">🌙</div>
    <div class="loading-text">Loading products...</div>
  </div>

  <!-- TILE GRID -->
  <div class="tile-grid-wrap hidden" id="tileGridWrap">
    <div class="tile-grid" id="tileGrid"></div>
  </div>

  <!-- PRODUCT LIST -->
  <div class="product-list" id="productList">
    <div id="productItems"></div>
  </div>

</div>

<!-- QUANTITY MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-product" id="modalProduct"></div>
    <div class="modal-tile" id="modalTile"></div>
    <div class="qty-row">
      <button class="qty-btn" onclick="changeQty(-1)">−</button>
      <div class="qty-display" id="qtyDisplay">1</div>
      <button class="qty-btn" onclick="changeQty(1)">+</button>
    </div>
    <div class="payment-row">
      <button class="pay-btn pay-cash" onclick="submitSale('Cash')">Cash</button>
      <button class="pay-btn pay-card" onclick="submitSale('Card')">Card</button>
    </div>
    <button class="pay-cancel" onclick="closeModal()">Cancel</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ── CONFIG ──────────────────────────────────────────────────
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzWZ_pYCfxewfml6rOg5R21yJFXaDoCNtQ61J_uVbUjHtafWd3OIWBgycFLtFAK6z1r/exec";
const LOCATION = "Eumundi";

// Tile icons fallback
const TILE_ICONS = {
  "moondrops": "🌑",
  "chains and cords": "⛓️",
  "1 moon pendant": "🌙",
  "1 moon bracelet": "⭕",
  "2 moon pendant": "🌙",
  "2 moon bracelet": "⭕",
  "3 moon pendant": "🌙",
  "3 moon bracelet": "⭕",
  "4 moon pendant": "🌙",
  "4 moon bracelet": "⭕",
  "5 moon pendant": "🌙",
  "5 moon bracelet": "⭕",
  "6 moon bracelet": "⭕",
  "rings and earrings": "💍",
  "prints, frames and coasters": "🖼️",
  "other": "✨"
};

// ── STATE ────────────────────────────────────────────────────
let tilesData = [];
let currentTile = null;
let selectedProduct = null;
let selectedTileName = null;
let qty = 1;

// ── INIT ─────────────────────────────────────────────────────
window.addEventListener('load', function() {
  loadConfig();
  loadStaff();
});

function loadConfig() {
  fetch(SCRIPT_URL + "?action=getPOSConfig&location=" + encodeURIComponent(LOCATION))
    .then(r => r.json())
    .then(data => {
      if (data.error) {
        showError(data.error);
        return;
      }
      tilesData = data.tiles || [];
      renderTiles();
    })
    .catch(err => showError("Could not load products. Check your connection."));
}

// ── LOAD STAFF ───────────────────────────────────────────────
function loadStaff() {
  fetch(SCRIPT_URL + "?action=getStaffList&location=" + encodeURIComponent(LOCATION))
    .then(r => r.json())
    .then(data => {
      const sel = document.getElementById("staffSelect");
      sel.innerHTML = '<option value="">Select staff...</option>';
      if (data.staff && data.staff.length > 0) {
        data.staff.forEach(name => {
          const opt = document.createElement("option");
          opt.value = name;
          opt.textContent = name;
          sel.appendChild(opt);
        });
      } else {
        sel.innerHTML = '<option value="">No staff found — check Staff Config tab</option>';
      }
    })
    .catch(() => {
      // Fallback — keep select usable
      const sel = document.getElementById("staffSelect");
      sel.innerHTML = '<option value="">Could not load staff</option>';
    });
}

// ── RENDER TILES ─────────────────────────────────────────────
function renderTiles() {
  document.getElementById("loadingScreen").style.display = "none";
  document.getElementById("tileGridWrap").classList.remove("hidden");

  document.getElementById("headerTitle").textContent = "Moonglow " + LOCATION;
  document.getElementById("headerSubtitle").textContent = tilesData.length + " categories";

  const grid = document.getElementById("tileGrid");
  grid.innerHTML = "";

  if (tilesData.length === 0) {
    grid.innerHTML = '<div class="empty-state"><div class="icon">🌙</div><div>No products found for ' + LOCATION + '.<br>Check the POS Config tab.</div></div>';
    return;
  }

  tilesData.forEach(tileData => {
    const icon = TILE_ICONS[tileData.tile.toLowerCase()] || "🌙";
    const div = document.createElement("div");
    div.className = "tile";

    // Background image if set
    const bgImage = tileData.tileImage || (tileData.products[0] && tileData.products[0].imageURL) || "";
    if (bgImage) {
      div.innerHTML = `<div class="tile-bg" style="background-image:url('${bgImage}');opacity:0.22;"></div>`;
    }

    div.innerHTML += `
      <div class="tile-content">
        <span class="tile-icon">${icon}</span>
        <div class="tile-name">${tileData.tile}</div>
        <div class="tile-count">${tileData.products.length} products</div>
      </div>`;

    div.onclick = () => openTile(tileData);
    grid.appendChild(div);
  });
}

// ── OPEN TILE ────────────────────────────────────────────────
function openTile(tileData) {
  currentTile = tileData;
  document.getElementById("tileGridWrap").classList.add("hidden");
  document.getElementById("productList").classList.add("active");
  document.getElementById("backBtn").classList.add("visible");
  document.getElementById("headerTitle").textContent = tileData.tile;
  document.getElementById("headerSubtitle").textContent = tileData.products.length + " products";

  const container = document.getElementById("productItems");
  container.innerHTML = "";

  if (tileData.products.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon">🌙</div><div>No products in this category.</div></div>';
    return;
  }

  tileData.products.forEach(product => {
    const div = document.createElement("div");
    div.className = "product-item";
    const imgHTML = product.imageURL
      ? `<img class="product-img" src="${product.imageURL}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="product-img-placeholder" style="display:none">🌙</div>`
      : `<div class="product-img-placeholder">🌙</div>`;
    div.innerHTML = `
      ${imgHTML}
      <div style="flex:1">
        <div class="product-name">${product.name}</div>
        ${product.sku ? `<div class="product-sku">${product.sku}</div>` : ""}
      </div>
      <span class="product-arrow">›</span>`;
    div.onclick = () => openModal(product, tileData.tile);
    container.appendChild(div);
  });
}

// ── BACK ─────────────────────────────────────────────────────
function goBack() {
  document.getElementById("tileGridWrap").classList.remove("hidden");
  document.getElementById("productList").classList.remove("active");
  document.getElementById("backBtn").classList.remove("visible");
  document.getElementById("headerTitle").textContent = "Moonglow " + LOCATION;
  document.getElementById("headerSubtitle").textContent = tilesData.length + " categories";
  currentTile = null;
}

// ── MODAL ────────────────────────────────────────────────────
function openModal(product, tileName) {
  selectedProduct = product;
  selectedTileName = tileName;
  qty = 1;
  document.getElementById("modalProduct").textContent = product.name;
  document.getElementById("modalTile").textContent = tileName;
  document.getElementById("qtyDisplay").textContent = qty;
  document.getElementById("modalOverlay").classList.add("active");
}

function closeModal() {
  document.getElementById("modalOverlay").classList.remove("active");
  selectedProduct = null;
}

function changeQty(delta) {
  qty = Math.max(1, qty + delta);
  document.getElementById("qtyDisplay").textContent = qty;
}

// ── SUBMIT SALE ──────────────────────────────────────────────
function submitSale(paymentMethod) {
  const staff = document.getElementById("staffSelect").value;
  if (!staff) {
    showToast("Please select a staff member", "error");
    return;
  }
  if (!selectedProduct) return;

  closeModal();

  const params = new URLSearchParams({
    action: "logSale",
    location: LOCATION,
    staff: staff,
    product: selectedProduct.name,
    sku: selectedProduct.sku || "",
    category: selectedTileName,
    quantity: qty,
    payment: paymentMethod,
    timestamp: new Date().toISOString()
  });

  fetch(SCRIPT_URL + "?" + params.toString())
    .then(r => r.json())
    .then(data => {
      if (data.error) {
        showToast("Error: " + data.error, "error");
      } else {
        showToast("Sale logged — " + qty + "x " + selectedProduct.name, "success");
      }
    })
    .catch(() => showToast("Saved locally — will sync when online", "success"));
}

// ── TOAST ────────────────────────────────────────────────────
function showToast(msg, type) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast " + (type || "");
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3000);
}

function showError(msg) {
  document.getElementById("loadingScreen").innerHTML =
    `<div class="empty-state"><div class="icon">⚠️</div><div>${msg}</div></div>`;
}

// Close modal on overlay tap
document.getElementById("modalOverlay").addEventListener("click", function(e) {
  if (e.target === this) closeModal();
});
</script>
</body>
</html>
